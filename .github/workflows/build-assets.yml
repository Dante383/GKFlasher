name: Build loader assets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Assemble loader assets
        run: python tools/build.py
      - name: Verify generated binaries
        run: python tools/build.py --check
      - uses: actions/upload-artifact@v4
        with:
          name: loader-assets-${{ runner.os }}
          path: build/out/
