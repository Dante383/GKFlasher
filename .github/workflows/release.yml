name: Build Workflow
on:
  push:
    branches:
      - main
      - 'test-*[0-9][0-9]-u[0-9]*'

permissions:
  contents: write

# Reserve one version at a time across main and test branches.
concurrency:
  group: gkflasher-release
  cancel-in-progress: false
  queue: max

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Calculate next version
        shell: pwsh
        run: |
          $tags = @(git tag --list --sort=-version:refname)
          if ($LASTEXITCODE -ne 0) { throw "Could not read version tags" }
          $latest = $tags |
            Where-Object { $_ -match '^v[0-9]+\.[0-9]+\.[0-9]+$' } |
            Select-Object -First 1
          if (-not $latest) { $latest = 'v1.0.59' }
          $version = [version]$latest.Substring(1)
          $tag = "v$($version.Major).$($version.Minor).$($version.Build + 1)"
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          Write-Output "Building $tag from $env:GITHUB_SHA"

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.3'
          architecture: 'x64'
          allow-prereleases: true

      - name: Install GKFlasher Requirements
        run: |
          pip install -r requirements.txt

      - name: Assemble loader assets
        run: python tools/build.py

      - name: Verify generated binaries
        run: python tools/build.py --check

      - name: Embed version into package
        run: |
          echo "__version__ = '$env:RELEASE_TAG'" > _version.py
      - name: Install Build Environment Prerequisites
        run: |
          pip install pyinstaller==6.16.0 pyinstaller-hooks-contrib==2025.9
          pip install cryptography==45.0.1
          pip install pillow==10.4.0

      - name: Build EXE Package
        run: |
          python -m PyInstaller .github/workflows/gui.spec
#  for debug purposes, upload the build artifact as a zip.
      - uses: actions/upload-artifact@v4
        with:
          ##name: Upload PyInstaller "Output" Directory
          path: |
            dist/*
            build/out/*

      - name: Install WiX
        run: dotnet tool install --global wix

      - name: Build MSI Package
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if (-not $tag) { throw "RELEASE_TAG is empty" }

          # Trim leading "v" and enforce MSI-friendly A.B.C
          $ver = $tag.TrimStart('v')
          if ($ver -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version '$ver' is not MSI-safe (expected a.b.c). Tag was '$tag'."
          }

          echo "Using MSI ProductVersion: $ver"

          # Compile .wxs to .wixobj
          candle .github/workflows/dialog.wxs `
                 .github/workflows/ui.wxs `
                 .github/workflows/product.wxs `
                 -dversion="$ver"

          # Link to .msi
          light -ext WixUIExtension -ext WixUtilExtension -sacl -spdb `
                -out "./GKFlasher-$tag-amd64.msi" `
                ./dialog.wixobj ./ui.wixobj ./product.wixobj

      - name: Create release tag
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git tag -a $env:RELEASE_TAG $env:GITHUB_SHA -m "Release $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Could not create release tag" }
          git push origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Could not push release tag" }

      - name: Upload MSI to Releases
        uses: "marvinpinto/action-automatic-releases@latest"
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: ${{ env.RELEASE_TAG }}
          prerelease: false
          title: ${{ env.RELEASE_TAG }}
          files: |
            GKFlasher-${{ env.RELEASE_TAG }}-amd64.msi
