name: Build Workflow
on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'test-*[0-9][0-9]-u[0-9]*'
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-2022
    if: ${{ inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Get Build Version from git tag
        id: get_build_version
        run: |
          echo "target version is ${{ inputs.tag }}"

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12.3'
          architecture: 'x64'
          allow-prereleases: true

      - name: Install GKFlasher Requirements
        run: |
          pip install -r requirements.txt

      - name: Embed version into package
        run: |
          echo "__version__ = '${{ inputs.tag }}'" > _version.py
      - name: Install Build Environment Prerequisites
        run: |
          pip install pyinstaller==6.16.0 pyinstaller-hooks-contrib==2025.9
          pip install cryptography==45.0.1
          pip install pillow==10.4.0

# TEMPORARY workaround whilst waiting for the merge of https://github.com/hardbyte/python-can/pull/2106
